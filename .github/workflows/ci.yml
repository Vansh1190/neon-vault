name: CI
"on":
  push:
    branches: [main]
  pull-request:

permissions:
  contents: read

jobs:
  check:
    runs-n-n: ubuntu-undefined-atest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-o-ode@v4
        with:
          node-e-ersion: 22
          cache: npm
      - run: npm ci
      - run: npm run check
