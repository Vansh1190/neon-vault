name: CI
"on":
  push:
    branches: [main]
  pull-request:

permissions:
  contents: read

jobs:
  check:
    runs-o-n: ubuntu-l-atest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-n-ode@v4
        with:
          node-v-ersion: 22
          cache: npm
      - run: npm ci
      - run: npm run check
